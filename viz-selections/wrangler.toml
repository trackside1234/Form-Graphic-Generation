name = "presenter-selections"
main = "src/index.js"
compatibility_date = "2026-08-14"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [ "/api/*" ]

[[kv_namespaces]]
binding = "SELECTIONS_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# The Viz Trio show these selections get imported into.
# Ops usually re-use the same show every week, so this can stay fixed —
# change it here (no code edit needed) if the show ever changes.
VIZ_SHOW_ID = "{B1DE8A36-7CE9-45B5-B276-4868D8073937}"

# Master template used for this graphic type (constant for the POC).
VIZ_MASTER_TEMPLATE = "LF_SELECTS"

# Trio archive/creator metadata — copied from a known-good export so the
# import behaves the same as a file saved directly out of Trio.
VIZ_CREATOR_VERSION = "3.2.4 (Build 24895)"
