<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Selections Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#12291F;
    --green-panel:#1B3A2C;
    --green-panel-2:#204331;
    --line:#33513F;
    --cream:#F1ECDE;
    --cream-dim:#B9C4B7;
    --gold:#C9A227;
    --gold-bright:#E6BE3F;
    --rust:#B5482C;
    --radius:10px;
    --shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--green-deep);
    background-image:
      radial-gradient(circle at 15% -10%, rgba(230,190,63,0.08), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(230,190,63,0.05), transparent 40%);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;letter-spacing:0.2px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{max-width:760px;margin:0 auto;padding:28px 18px 64px;}
  header.topbar{
    display:flex;align-items:baseline;justify-content:space-between;
    padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--line);
  }
  header.topbar .brand{display:flex;align-items:baseline;gap:10px;}
  header.topbar .brand .mark{
    width:30px;height:30px;border-radius:50%;background:var(--gold);
    display:inline-flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--green-deep);font-size:14px;
    flex:none;
  }
  header.topbar h1{font-size:20px;color:var(--cream);}
  header.topbar .tag{font-size:12px;color:var(--cream-dim);text-transform:uppercase;letter-spacing:1.2px;}
  .nav-link{font-size:13px;color:var(--cream-dim);text-decoration:none;border-bottom:1px dotted var(--cream-dim);}
  .nav-link:hover{color:var(--gold-bright);border-color:var(--gold-bright);}

  .card{
    background:var(--green-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:16px;
  }
  .card + .card{margin-top:16px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;
    color:var(--gold);text-transform:uppercase;margin-bottom:6px;display:block;
  }
  p.lead{color:var(--cream-dim);font-size:14.5px;line-height:1.55;margin:6px 0 0;}

  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;}
  @media(max-width:520px){.role-grid{grid-template-columns:1fr;}}
  .role-card{
    background:var(--green-panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px 20px;text-decoration:none;color:var(--cream);
    transition:border-color .15s, transform .15s;
    display:block;
  }
  .role-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .role-card .role-title{font-family:'Fraunces',serif;font-size:19px;color:var(--gold-bright);margin-bottom:6px;}
  .role-card .role-desc{font-size:13px;color:var(--cream-dim);line-height:1.5;}

  .presenter-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  @media(max-width:480px){.presenter-grid{grid-template-columns:1fr;}}
  .presenter-btn{
    background:var(--green-panel-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;text-align:left;color:var(--cream);font-size:15px;font-weight:600;
    cursor:pointer;transition:border-color .15s;font-family:'Inter',sans-serif;
  }
  .presenter-btn:hover{border-color:var(--gold);}
  .presenter-btn .done-pill{
    display:inline-block;margin-top:6px;font-size:11px;font-family:'IBM Plex Mono',monospace;
    color:var(--gold-bright);letter-spacing:0.5px;
  }

  label{display:block;font-size:12px;color:var(--cream-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.8px;}
  input[type=date], select, input[type=text]{
    width:100%;background:var(--green-deep);border:1px solid var(--line);color:var(--cream);
    border-radius:8px;padding:11px 12px;font-size:15px;font-family:'Inter',sans-serif;
  }
  input[type=date]:focus, select:focus, input[type=text]:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .field{margin-bottom:16px;}
  .row{display:flex;gap:12px;}
  .row > .field{flex:1;}

  button.btn{
    background:var(--gold);color:var(--green-deep);border:none;border-radius:8px;
    padding:12px 18px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;
    transition:background .15s;
  }
  button.btn:hover{background:var(--gold-bright);}
  button.btn:disabled{background:#5a5a4d;color:#a9a99c;cursor:not-allowed;}
  button.btn.ghost{
    background:transparent;color:var(--cream);border:1px solid var(--line);
  }
  button.btn.ghost:hover{border-color:var(--gold);color:var(--gold-bright);}
  button.btn.small{padding:8px 12px;font-size:13px;}

  .meeting-item{
    border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;
    cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  }
  .meeting-item:hover{border-color:var(--gold);}
  .meeting-item.selected{border-color:var(--gold);background:rgba(201,162,39,0.08);}
  .meeting-item .m-name{font-weight:600;}
  .meeting-item .m-meta{font-size:12px;color:var(--cream-dim);}

  .race-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .race-tab{
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
    background:var(--green-panel-2);border:1px solid var(--line);color:var(--cream-dim);
    border-radius:6px;padding:7px 11px;cursor:pointer;
  }
  .race-tab.active{border-color:var(--gold);color:var(--gold-bright);}
  .race-tab.done::after{content:" \2713";color:var(--gold-bright);}

  .race-head{margin-bottom:14px;}
  .race-head .r-title{font-size:18px;}
  .race-head .r-meta{font-size:12.5px;color:var(--cream-dim);margin-top:2px;}

  .runner{
    display:flex;align-items:center;gap:14px;
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;
    cursor:pointer;transition:border-color .15s, background .15s;
    background:var(--green-panel-2);
  }
  .runner:hover{border-color:var(--gold);}
  .runner.selected{border-color:var(--gold-bright);background:rgba(201,162,39,0.14);}
  .runner.scratched{opacity:0.4;cursor:not-allowed;}
  .saddlecloth{
    flex:none;width:38px;height:38px;border-radius:6px;background:var(--cream);color:var(--green-deep);
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;
    font-weight:700;font-size:16px;border:2px solid var(--green-deep);
  }
  .runner .r-name{font-weight:600;font-size:15px;}
  .runner .r-trainer{font-size:12.5px;color:var(--cream-dim);margin-top:2px;}
  .runner .r-check{margin-left:auto;color:var(--gold-bright);font-size:18px;visibility:hidden;}
  .runner.selected .r-check{visibility:visible;}

  table.board{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.board th, table.board td{
    border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;
  }
  table.board th{
    background:var(--green-panel-2);font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--gold);
  }
  table.board td.empty{color:var(--cream-dim);font-style:italic;}
  table.board .cell-horse{font-weight:600;}
  table.board .cell-trainer{color:var(--cream-dim);font-size:12px;}
  .silk-edit{
    font-family:'IBM Plex Mono',monospace;font-size:11px;background:transparent;color:var(--cream-dim);
    border:1px dashed var(--line);border-radius:5px;padding:3px 5px;width:120px;margin-top:4px;
  }

  .status{font-size:13px;margin-top:10px;min-height:18px;}
  .status.good{color:var(--gold-bright);}
  .status.bad{color:var(--rust);}
  .empty-state{color:var(--cream-dim);font-size:14px;padding:20px 0;text-align:center;}

  .export-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .table-wrap{overflow-x:auto;}
  footer.hint{font-size:12px;color:var(--cream-dim);margin-top:26px;text-align:center;}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
const $ = sel => document.querySelector(sel);
const el = (html) => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function getJSON(u, opts){
  const r = await fetch(u, opts);
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

// ---------- router ----------
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return parts;
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

function shell(title, tag, bodyNode, backHref){
  const app = $('#app');
  app.innerHTML = '';
  const header = el(`
    <header class="topbar">
      <div class="brand">
        <span class="mark">S</span>
        <div><h1>${esc(title)}</h1><div class="tag">${esc(tag)}</div></div>
      </div>
      ${backHref ? `<a class="nav-link" href="${backHref}">&larr; back</a>` : ''}
    </header>
  `);
  app.appendChild(header);
  app.appendChild(bodyNode);
  const foot = el(`<footer class="hint">Internal tool &middot; no login required &middot; selections reset each time the producer starts a new raceday</footer>`);
  app.appendChild(foot);
}

async function render(){
  const parts = currentRoute();
  if(parts[0] === 'setup') return renderSetup();
  if(parts[0] === 'select' && parts[1]) return renderSelect(parts[1]);
  if(parts[0] === 'dashboard') return renderDashboard();
  return renderLanding();
}

// ---------- landing ----------
function renderLanding(){
  const body = el(`
    <div>
      <div class="card">
        <span class="eyebrow">Race Day Selections</span>
        <p class="lead">Pick a runner for each race, one selection per presenter. The producer collates everything into a Viz Trio graphics import and a backup document.</p>
      </div>
      <div class="role-grid">
        <a class="role-card" href="#/setup">
          <div class="role-title">I'm the Producer</div>
          <div class="role-desc">Set today's meeting and races, then collect selections and export.</div>
        </a>
        <a class="role-card" href="#/dashboard">
          <div class="role-title">View Dashboard</div>
          <div class="role-desc">See what's been submitted and download the XML / Word backup.</div>
        </a>
      </div>
      <div class="card" style="margin-top:16px">
        <span class="eyebrow">Presenters</span>
        <div id="presenterList" class="presenter-grid"></div>
      </div>
    </div>
  `);
  shell('Selections Board', 'Presenter selections \u2192 Viz Trio graphics', body);

  (async () => {
    const list = $('#presenterList');
    try {
      const [{ presenters }, { raceday }] = await Promise.all([
        getJSON('/api/presenters'), getJSON('/api/raceday')
      ]);
      let doneIds = new Set();
      if(raceday){
        try{ const { selections } = await getJSON('/api/selections'); doneIds = new Set(selections.map(s=>s.presenterId)); }catch{}
      }
      list.innerHTML = '';
      presenters.forEach(p => {
        const btn = el(`<button class="presenter-btn">${esc(p.name)}${doneIds.has(p.id) ? `<div class="done-pill">SELECTIONS IN &mdash; TAP TO REVIEW</div>`:''}</button>`);
        btn.onclick = () => location.hash = `#/select/${p.id}`;
        list.appendChild(btn);
      });
      if(!raceday){
        list.appendChild(el(`<div class="empty-state" style="grid-column:1/-1">No raceday set yet &mdash; ask the producer to set it up first.</div>`));
      }
    } catch(e){
      list.innerHTML = `<div class="empty-state">Could not load presenters: ${esc(e.message)}</div>`;
    }
  })();
}

// ---------- producer setup ----------
function renderSetup(){
  const body = el(`
    <div>
      <div class="card">
        <span class="eyebrow">Step 1 &middot; Pick the date</span>
        <div class="row">
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" value="${todayISO()}">
          </div>
          <div class="field">
            <label for="category">Code</label>
            <select id="category">
              <option value="T">Thoroughbred</option>
              <option value="H">Harness</option>
            </select>
          </div>
        </div>
        <button class="btn" id="loadMeetings">Find meetings</button>
        <div class="status" id="meetingsStatus"></div>
      </div>
      <div class="card" id="meetingsCard" style="display:none">
        <span class="eyebrow">Step 2 &middot; Choose the meeting</span>
        <div id="meetingsList"></div>
      </div>
      <div class="card" id="confirmCard" style="display:none">
        <span class="eyebrow">Step 3 &middot; Confirm &amp; publish</span>
        <p class="lead" id="confirmSummary"></p>
        <button class="btn" id="publishBtn">Set as today's raceday</button>
        <div class="status" id="publishStatus"></div>
      </div>
    </div>
  `);
  shell('Producer Setup', 'Choose the venue and races for today', body, '#/');

  let chosenMeeting = null;

  $('#loadMeetings').onclick = async () => {
    const date = $('#date').value;
    const category = $('#category').value;
    const status = $('#meetingsStatus');
    status.textContent = 'Loading meetings\u2026'; status.className='status';
    try {
      const p = await getJSON(`/api/meetings?date=${encodeURIComponent(date)}&country=NZ&category=${category}`);
      const meetings = p?.meetings || p?.data?.meetings || (Array.isArray(p?.data)?p.data:[]) || [];
      const list = $('#meetingsList');
      list.innerHTML = '';
      if(!meetings.length){
        list.innerHTML = `<div class="empty-state">No meetings found for this date.</div>`;
      }
      meetings.forEach(m => {
        const name = m.name || m.meeting_name || m.venue_name || 'Unnamed meeting';
        const races = m.races || m.events || [];
        const item = el(`<div class="meeting-item"><div><div class="m-name">${esc(name)}</div><div class="m-meta">${races.length} races &middot; ${esc(m.track_condition||'')}</div></div><span class="mono" style="color:var(--gold)">Select \u2192</span></div>`);
        item.onclick = () => selectMeeting(item, name, races, date, category);
        list.appendChild(item);
      });
      $('#meetingsCard').style.display = 'block';
      status.textContent = `${meetings.length} meeting(s) found.`; status.className='status good';
    } catch(e){
      status.textContent = e.message; status.className = 'status bad';
    }
  };

  async function selectMeeting(itemNode, name, races, date, category){
    document.querySelectorAll('.meeting-item').forEach(n=>n.classList.remove('selected'));
    itemNode.classList.add('selected');
    const status = $('#meetingsStatus');
    status.textContent = 'Loading race details\u2026'; status.className='status';
    try {
      const raceDetails = [];
      for(const r of races){
        const id = r.id || r.event_id;
        if(!id) continue;
        const ev = await getJSON(`/api/event/${encodeURIComponent(id)}`);
        raceDetails.push({
          race_number: Number(ev.race?.race_number) || raceDetails.length + 1,
          event_id: id,
          description: ev.race?.description || ''
        });
      }
      raceDetails.sort((a,b)=>a.race_number-b.race_number);
      chosenMeeting = { date, country: 'NZ', category, meeting_name: name, races: raceDetails };
      $('#confirmSummary').textContent = `${name} \u2014 ${raceDetails.length} races on ${date}. Publishing will reset any selections already submitted for the previous raceday.`;
      $('#confirmCard').style.display = 'block';
      status.textContent = 'Ready to publish.'; status.className='status good';
    } catch(e){
      status.textContent = e.message; status.className='status bad';
    }
  }

  $('#publishBtn').onclick = async () => {
    if(!chosenMeeting) return;
    const status = $('#publishStatus');
    status.textContent = 'Publishing\u2026'; status.className='status';
    try {
      await getJSON('/api/raceday', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(chosenMeeting) });
      status.textContent = 'Published. Presenters can now make their selections.'; status.className='status good';
    } catch(e){
      status.textContent = e.message; status.className='status bad';
    }
  };
}

// ---------- presenter selection flow ----------
function renderSelect(presenterId){
  const body = el(`<div id="selectBody"><div class="empty-state">Loading\u2026</div></div>`);
  shell('Make Your Selections', 'Pick one runner per race', body, '#/');

  (async () => {
    try {
      const [{ presenters }, { raceday }] = await Promise.all([getJSON('/api/presenters'), getJSON('/api/raceday')]);
      const presenter = presenters.find(p=>p.id===presenterId);
      if(!presenter){ body.innerHTML = `<div class="empty-state">Unknown presenter.</div>`; return; }
      if(!raceday){ body.innerHTML = `<div class="empty-state">No raceday has been set up yet. Ask the producer to publish one first.</div>`; return; }

      const { selections } = await getJSON('/api/selections');
      const mySelections = new Map(selections.filter(s=>s.presenterId===presenterId).map(s=>[s.raceNumber, s]));

      const races = raceday.races;
      let current = 0;
      const runnerCache = new Map();

      const wrap = el(`
        <div>
          <div class="card">
            <span class="eyebrow">${esc(presenter.name)}</span>
            <p class="lead">${esc(raceday.meeting_name)} &middot; ${esc(raceday.date)}</p>
          </div>
          <div class="race-tabs" id="raceTabs"></div>
          <div class="card" id="raceCard"></div>
        </div>
      `);
      body.innerHTML = ''; body.appendChild(wrap);

      function renderTabs(){
        const tabs = $('#raceTabs');
        tabs.innerHTML = '';
        races.forEach((r, i) => {
          const t = el(`<button class="race-tab ${i===current?'active':''} ${mySelections.has(r.race_number)?'done':''}">R${r.race_number}</button>`);
          t.onclick = () => { current = i; renderTabs(); renderRace(); };
          tabs.appendChild(t);
        });
      }

      async function renderRace(){
        const raceCard = $('#raceCard');
        raceCard.innerHTML = `<div class="empty-state">Loading runners\u2026</div>`;
        const race = races[current];
        let ev = runnerCache.get(race.event_id);
        if(!ev){
          ev = await getJSON(`/api/event/${encodeURIComponent(race.event_id)}`);
          runnerCache.set(race.event_id, ev);
        }
        const existing = mySelections.get(race.race_number);
        const runners = (ev.runners||[]).filter(r=>!r.is_scratched);
        raceCard.innerHTML = '';
        raceCard.appendChild(el(`
          <div class="race-head">
            <div class="r-title">Race ${race.race_number} &mdash; ${esc(ev.race?.description||'')}</div>
            <div class="r-meta">${esc(ev.race?.distance||'')}m &middot; ${runners.length} runners</div>
          </div>
        `));
        runners.forEach(r => {
          const isSel = existing && String(existing.runnerNumber) === String(r.runner_number);
          const node = el(`
            <div class="runner ${isSel?'selected':''}" data-runner="${esc(r.runner_number)}">
              <div class="saddlecloth">${esc(r.runner_number)}</div>
              <div>
                <div class="r-name">${esc(r.name)}</div>
                <div class="r-trainer">T: ${esc(r.trainer_name||r.trainer||'')}</div>
              </div>
              <div class="r-check">&#10003;</div>
            </div>
          `);
          node.onclick = async () => {
            try {
              const saved = await getJSON('/api/selection', {
                method:'POST', headers:{'content-type':'application/json'},
                body: JSON.stringify({
                  presenterId, raceNumber: race.race_number,
                  runnerNumber: r.runner_number, horseName: r.name,
                  trainerName: r.trainer_name || r.trainer || ''
                })
              });
              mySelections.set(race.race_number, saved.selection);
              renderTabs();
              renderRace();
            } catch(e){ alert(e.message); }
          };
          raceCard.appendChild(node);
        });
      }

      renderTabs();
      renderRace();
    } catch(e){
      body.innerHTML = `<div class="empty-state">${esc(e.message)}</div>`;
    }
  })();
}

// ---------- producer dashboard ----------
function renderDashboard(){
  const body = el(`<div id="dashBody"><div class="empty-state">Loading\u2026</div></div>`);
  shell('Producer Dashboard', 'Review selections and export', body, '#/');

  (async () => {
    try {
      const { raceday } = await getJSON('/api/raceday');
      if(!raceday){
        $('#dashBody').innerHTML = `<div class="card"><div class="empty-state">No raceday set yet. <a class="nav-link" href="#/setup">Set one up</a>.</div></div>`;
        return;
      }
      const [{ presenters }, { selections }] = await Promise.all([getJSON('/api/presenters'), getJSON('/api/selections')]);
      const byRaceAndPresenter = new Map();
      selections.forEach(s => byRaceAndPresenter.set(`${s.raceNumber}:${s.presenterId}`, s));

      const rows = raceday.races.map(r => {
        const cells = presenters.map(p => {
          const sel = byRaceAndPresenter.get(`${r.race_number}:${p.id}`);
          if(!sel) return `<td class="empty">&mdash;</td>`;
          return `<td>
            <div class="cell-horse">${esc(sel.runnerNumber)}, ${esc(sel.horseName)}</div>
            <div class="cell-trainer">T: ${esc(sel.trainerName)}</div>
            <input class="silk-edit" data-race="${r.race_number}" data-presenter="${p.id}" value="${esc(sel.silkSlug)}" title="Silk key (edit if wrong)">
          </td>`;
        }).join('');
        return `<tr><th>R${r.race_number}<br><span style="font-weight:400;font-size:11px;color:var(--cream-dim)">${esc(r.description||'')}</span></th>${cells}</tr>`;
      }).join('');

      const filled = selections.length, total = raceday.races.length * presenters.length;

      $('#dashBody').innerHTML = `
        <div class="card">
          <span class="eyebrow">${esc(raceday.meeting_name)} &middot; ${esc(raceday.date)}</span>
          <p class="lead">${filled} of ${total} selections submitted.</p>
          <div class="export-row">
            <button class="btn" id="exportXml">Download Viz Trio XML</button>
            <button class="btn ghost" id="exportDoc">Download Word backup</button>
            <a class="btn ghost" href="#/setup" style="text-decoration:none;display:inline-flex;align-items:center">Start new raceday</a>
          </div>
          <div class="status" id="exportStatus"></div>
        </div>
        <div class="card">
          <span class="eyebrow">Selections grid</span>
          <div class="table-wrap">
            <table class="board">
              <thead><tr><th>Race</th>${presenters.map(p=>`<th>${esc(p.first)}</th>`).join('')}</tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;

      document.querySelectorAll('.silk-edit').forEach(input => {
        input.onchange = async () => {
          try {
            await getJSON('/api/selection/silk', {
              method:'POST', headers:{'content-type':'application/json'},
              body: JSON.stringify({ raceNumber: input.dataset.race, presenterId: input.dataset.presenter, silkSlug: input.value })
            });
          } catch(e){ alert(e.message); }
        };
      });

      $('#exportXml').onclick = () => { window.location.href = '/api/export/xml'; };
      $('#exportDoc').onclick = () => { window.location.href = '/api/export/doc'; };
    } catch(e){
      $('#dashBody').innerHTML = `<div class="empty-state">${esc(e.message)}</div>`;
    }
  })();
}
</script>
</body>
</html>
