<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Selections Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#19233e;
    --navy-panel:#222d4d;
    --navy-panel-2:#29365c;
    --line:#3a4770;
    --ink:#EDEFF5;
    --ink-dim:#9AA5C4;
    --teal:#68D7D0;
    --teal-bright:#8EE6E0;
    --coral:#E2574C;
    --radius:10px;
    --shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-deep);
    background-image:
      radial-gradient(circle at 15% -10%, rgba(104,215,208,0.10), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(104,215,208,0.06), transparent 40%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;letter-spacing:0.2px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{max-width:820px;margin:0 auto;padding:28px 18px 64px;}
  header.topbar{
    display:flex;align-items:baseline;justify-content:space-between;
    padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--line);
  }
  header.topbar .brand{display:flex;align-items:baseline;gap:10px;}
  header.topbar .brand .mark{
    width:30px;height:30px;border-radius:50%;background:var(--teal);
    display:inline-flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--navy-deep);font-size:14px;
    flex:none;
  }
  header.topbar h1{font-size:20px;color:var(--ink);}
  header.topbar .tag{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:1.2px;}
  .nav-link{font-size:13px;color:var(--ink-dim);text-decoration:none;border-bottom:1px dotted var(--ink-dim);}
  .nav-link:hover{color:var(--teal-bright);border-color:var(--teal-bright);}
  .nav-link.pending{color:#5a638a;border-color:#5a638a;cursor:progress;}
  .card{
    background:var(--navy-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:16px;
  }
  .card + .card{margin-top:16px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;
    color:var(--teal);text-transform:uppercase;margin-bottom:6px;display:block;
  }
  p.lead{color:var(--ink-dim);font-size:14.5px;line-height:1.55;margin:6px 0 0;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;}
  @media(max-width:520px){.role-grid{grid-template-columns:1fr;}}
  .role-card{
    background:var(--navy-panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px 20px;text-decoration:none;color:var(--ink);
    transition:border-color .15s, transform .15s;
    display:block;
  }
  .role-card:hover{border-color:var(--teal);transform:translateY(-2px);}
  .role-card .role-title{font-family:'Fraunces',serif;font-size:19px;color:var(--teal-bright);margin-bottom:6px;}
  .role-card .role-desc{font-size:13px;color:var(--ink-dim);line-height:1.5;}
  .presenter-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  @media(max-width:480px){.presenter-grid{grid-template-columns:1fr;}}
  .presenter-btn{
    background:var(--navy-panel-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;text-align:left;color:var(--ink);font-size:15px;font-weight:600;
    cursor:pointer;transition:border-color .15s;font-family:'Inter',sans-serif;
  }
  .presenter-btn:hover{border-color:var(--teal);}
  .presenter-btn .done-pill{
    display:inline-block;margin-top:6px;font-size:11px;font-family:'IBM Plex Mono',monospace;
    color:var(--teal-bright);letter-spacing:0.5px;
  }
  label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.8px;}
  input[type=date], select, input[type=text]{
    width:100%;background:var(--navy-deep);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:11px 12px;font-size:15px;font-family:'Inter',sans-serif;
  }
  input[type=date]:focus, select:focus, input[type=text]:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .field{margin-bottom:16px;}
  .row{display:flex;gap:12px;}
  .row > .field{flex:1;}
  button.btn{
    background:var(--teal);color:var(--navy-deep);border:none;border-radius:8px;
    padding:12px 18px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;
    transition:background .15s;
  }
  button.btn:hover{background:var(--teal-bright);}
  button.btn:disabled{background:#4a5470;color:#8b93ab;cursor:not-allowed;}
  button.btn.ghost{
    background:transparent;color:var(--ink);border:1px solid var(--line);
  }
  button.btn.ghost:hover{border-color:var(--teal);color:var(--teal-bright);}
  button.btn.small{padding:8px 12px;font-size:13px;}
  .meeting-item{
    border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;
    cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  }
  .meeting-item:hover{border-color:var(--teal);}
  .meeting-item.selected{border-color:var(--teal);background:rgba(104,215,208,0.08);}
  .meeting-item .m-name{font-weight:600;}
  .meeting-item .m-meta{font-size:12px;color:var(--ink-dim);}
  .race-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .race-tab{
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
    background:var(--navy-panel-2);border:1px solid var(--line);color:var(--ink-dim);
    border-radius:6px;padding:7px 11px;cursor:pointer;
  }
  .race-tab.active{border-color:var(--teal);color:var(--teal-bright);}
  .race-tab.done::after{content:" \2713";color:var(--teal-bright);}
  .race-head{margin-bottom:14px;}
  .race-head .r-title{font-size:18px;}
  .race-head .r-meta{font-size:12.5px;color:var(--ink-dim);margin-top:2px;}
  .runner{
    display:flex;align-items:center;gap:14px;
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;
    cursor:pointer;transition:border-color .15s, background .15s;
    background:var(--navy-panel-2);
  }
  .runner:hover{border-color:var(--teal);}
  .runner.selected{border-color:var(--teal-bright);background:rgba(104,215,208,0.14);}
  .runner.scratched{opacity:0.4;cursor:not-allowed;}
  .saddlecloth{
    flex:none;width:38px;height:38px;border-radius:6px;background:var(--ink);color:var(--navy-deep);
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;
    font-weight:700;font-size:16px;border:2px solid var(--navy-deep);
  }
  .runner .r-name{font-weight:600;font-size:15px;}
  .runner .r-trainer{font-size:12.5px;color:var(--ink-dim);margin-top:2px;}
  .runner .r-check{margin-left:auto;color:var(--teal-bright);font-size:18px;visibility:hidden;}
  .runner.selected .r-check{visibility:visible;}
  table.board{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.board th, table.board td{
    border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;
  }
  table.board th{
    background:var(--navy-panel-2);font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--teal);
  }
  table.board td.empty{color:var(--ink-dim);font-style:italic;}
  table.board .cell-horse{font-weight:600;}
  table.board .cell-trainer{color:var(--ink-dim);font-size:12px;}
  .silk-edit{
    font-family:'IBM Plex Mono',monospace;font-size:11px;background:transparent;color:var(--ink-dim);
    border:1px dashed var(--line);border-radius:5px;padding:3px 5px;width:120px;margin-top:4px;
  }
  .status{font-size:13px;margin-top:10px;min-height:18px;}
  .status.good{color:var(--teal-bright);}
  .status.bad{color:var(--coral);}
  .empty-state{color:var(--ink-dim);font-size:14px;padding:20px 0;text-align:center;}
  .export-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .table-wrap{overflow-x:auto;}
  .pick-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}
  .pick-tab{background:var(--navy-panel-2);border:1px solid var(--line);color:var(--ink-dim);border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer}
  .pick-tab.active{border-color:var(--teal);color:var(--teal-bright);background:rgba(104,215,208,.08)}
  .pick-step{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .pick-label{font-size:11px;color:var(--teal);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
  .pick-summary{background:var(--navy-panel-2);border:1px solid var(--line);border-radius:9px;padding:14px;margin-top:14px}
  .pick-summary strong{font-size:16px}.pick-summary small{display:block;color:var(--ink-dim);margin-top:4px}
  .pick-runner{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--navy-panel-2);padding:12px;border-radius:9px;margin-top:8px;cursor:pointer}
  .pick-runner:hover,.pick-runner.selected{border-color:var(--teal);background:rgba(104,215,208,.08)}
  .pick-runner .num{width:34px;height:34px;display:grid;place-items:center;background:var(--ink);color:var(--navy-deep);border-radius:6px;font-family:'IBM Plex Mono',monospace;font-weight:700;flex:none}
  .pick-runner .meta{font-size:12px;color:var(--ink-dim);margin-top:2px}.pick-runner .check{margin-left:auto;color:var(--teal-bright);font-size:18px;visibility:hidden}.pick-runner.selected .check{visibility:visible}
  .saved-pick{border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:8px;background:var(--navy-panel-2)}
  .saved-pick .kind{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal);text-transform:uppercase;letter-spacing:.8px}
  .saved-pick strong{display:block;margin-top:3px}.saved-pick small{display:block;color:var(--ink-dim);margin-top:3px}
  footer.hint{font-size:12px;color:var(--ink-dim);margin-top:26px;text-align:center;}
  .speedmap-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .speedmap-race{margin-bottom:18px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--navy-panel-2)}
  .speedmap-race-head{padding:12px 14px;background:rgba(104,215,208,0.06);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
  .speedmap-race-title{font-weight:700}.speedmap-race-meta{font-size:12px;color:var(--ink-dim)}
  .speedmap-runner{display:grid;grid-template-columns:54px minmax(180px,1.2fr) minmax(260px,2fr) 62px;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.05)}
  .speedmap-runner:last-child{border-bottom:none}.speedmap-barrier{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--teal-bright)}
  .speedmap-name{font-weight:600}.speedmap-name small{display:block;color:var(--ink-dim);font-size:11px;margin-top:2px}
  .speedmap-range{width:100%;accent-color:var(--teal);cursor:pointer}.speedmap-value{font-family:'IBM Plex Mono',monospace;text-align:right;font-weight:700;color:var(--teal-bright)}
  @media(max-width:760px){.speedmap-runner{grid-template-columns:42px 1fr 58px}.speedmap-range{grid-column:2/4;grid-row:2}.speedmap-value{grid-column:3;grid-row:1}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const $ = sel => document.querySelector(sel);
const el = (html) => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function getJSON(u, opts){
  const r = await fetch(u, opts);
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

// ---------- router ----------
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return parts;
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

function shell(title, tag, bodyNode, backHref){
  const app = $('#app');
  app.innerHTML = '';
  const header = el(`
    <header class="topbar">
      <div class="brand">
        <span class="mark">S</span>
        <div><h1>${esc(title)}</h1><div class="tag">${esc(tag)}</div></div>
      </div>
      ${backHref ? `<a class="nav-link" href="${backHref}">&larr; back</a>` : ''}
    </header>
  `);
  app.appendChild(header);
  app.appendChild(bodyNode);
  const foot = el(`<footer class="hint">Internal tool &middot; no login required &middot; selections reset each time the producer publishes a new preview list</footer>`);
  app.appendChild(foot);
}

async function render(){
  const parts = currentRoute();
  if(parts[0] === 'setup') return renderSetup();
  if(parts[0] === 'select' && parts[1]) return renderSelect(parts[1]);
  if(parts[0] === 'dashboard') return renderDashboard();
  if(parts[0] === 'speedmaps') return renderSpeedMaps();
  if(parts[0] === 'picks' && parts[1]) return renderPresenterPicks(parts[1]);
  return renderLanding();
}

// ---------- landing ----------
function renderLanding(){
  const body = el(`
    <div>
      <div class="card">
        <span class="eyebrow">Preview Show Selections</span>
        <p class="lead">Pick a runner for each race in today's preview list, one selection per presenter. Speed Maps can be edited here by presenters or from the Producer Dashboard.</p>
      </div>
      <div class="role-grid">
        <a class="role-card" href="#/dashboard">
          <div class="role-title">Producer Dashboard</div>
          <div class="role-desc">Set races for the week, monitor presenter selections, edit Speed Maps and export graphics.</div>
        </a>
        <a class="role-card" href="#/speedmaps">
          <div class="role-title">Speed Maps</div>
          <div class="role-desc">Open the full Speed Map editor.</div>
        </a>
      </div>
      <div class="card" style="margin-top:16px">
        <span class="eyebrow">Presenters</span>
        <div id="presenterList" class="presenter-grid"></div>
      </div>
      <div id="homeSpeedMaps" style="margin-top:16px"></div>
    </div>
  `);
  shell('Selections Board', 'Presenter selections → Viz Trio graphics', body);
  (async () => {
    const list = $('#presenterList');
    try {
      const [{ presenters }, { show }] = await Promise.all([
        getJSON('/api/presenters'), getJSON('/api/show')
      ]);
      let doneIds = new Set();
      if(show){
        try{ const { selections } = await getJSON('/api/selections'); doneIds = new Set(selections.map(s=>s.presenterId)); }catch{}
      }
      list.innerHTML = '';
      presenters.forEach(p => {
        const wrap = el(`<div class="presenter-btn" style="display:block;cursor:default"><div style="font-weight:700">${esc(p.name)}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
            <button class="btn small" data-make>Make Selections</button>
          </div>
        </div>`);
        wrap.querySelector('[data-make]').onclick = () => location.hash = `#/select/${p.id}`;
        list.appendChild(wrap);
      });
      if(!show){
        list.appendChild(el(`<div class="empty-state" style="grid-column:1/-1">No preview list set yet &mdash; use the Producer Dashboard to set races.</div>`));
        $('#homeSpeedMaps').innerHTML = `<div class="card"><span class="eyebrow">Speed Maps</span><div class="empty-state">No races have been set yet.</div></div>`;
      } else {
        mountSpeedMapEditor($('#homeSpeedMaps'), { compact: true, home: true });
      }
    } catch(e){
      list.innerHTML = `<div class="empty-state">Could not load presenters: ${esc(e.message)}</div>`;
    }
  })();
}

// ---------- producer setup ----------
function renderSetup(){
  const body = el(`
    <div>
      <div class="card">
        <span class="eyebrow">Find meetings</span>
        <div class="row">
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" value="${todayISO()}">
          </div>
          <div class="field">
            <label for="category">Code</label>
            <select id="category">
              <option value="T">Thoroughbred</option>
              <option value="H">Harness</option>
            </select>
          </div>
        </div>
        <button class="btn" id="loadMeetings">Find meetings</button>
        <div class="status" id="meetingsStatus"></div>
      </div>
      <div class="card" id="meetingsCard" style="display:none">
        <span class="eyebrow">Meetings &middot; tap a meeting to expand, then tap a race to add it &middot; stays open until you collapse it</span>
        <div id="meetingsList"></div>
      </div>
      <div class="card" id="cartCard">
        <span class="eyebrow">Races to be previewed</span>
        <p class="lead" id="cartSummary">No races added yet.</p>
        <div id="cartList"></div>
        <button class="btn" id="publishBtn" disabled>Publish preview list</button>
        <div class="export-row"><a class="btn ghost" href="#/speedmaps" style="text-decoration:none;display:inline-flex;align-items:center">Open Speed Maps</a></div>
        <div class="status" id="publishStatus"></div>
      </div>
    </div>
  `);
  shell('Producer Setup', 'Build the races-to-be-previewed list for today\u2019s show', body, '#/');

  let cart = [];
  const raceCache = new Map();
  const expandedMeetings = new Set();
  let lastMeetings = [];
  let lastDate = '';
  let lastCategory = 'T';

  function inCart(eventId){ return cart.some(r => r.event_id === eventId); }

  function renderCart(){
    const list = $('#cartList');
    const summary = $('#cartSummary');
    const publishBtn = $('#publishBtn');
    list.innerHTML = '';
    if(!cart.length){
      summary.textContent = 'No races added yet.';
      publishBtn.disabled = true;
      return;
    }
    const venues = new Set(cart.map(r=>r.meeting_name));
    summary.textContent = `${cart.length} race(s) across ${venues.size} meeting(s).`;
    cart.forEach((r, i) => {
      const row = el(`
        <div class="meeting-item" style="cursor:default">
          <div>
            <div class="m-name">${esc(r.meeting_name)} &middot; R${r.race_number}</div>
            <div class="m-meta">${esc(r.description||'')}</div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn ghost small" data-act="up">&uarr;</button>
            <button class="btn ghost small" data-act="down">&darr;</button>
            <button class="btn ghost small" data-act="remove">Remove</button>
          </div>
        </div>
      `);
      row.querySelector('[data-act=up]').onclick = () => { if(i>0){ [cart[i-1],cart[i]]=[cart[i],cart[i-1]]; renderCart(); } };
      row.querySelector('[data-act=down]').onclick = () => { if(i<cart.length-1){ [cart[i+1],cart[i]]=[cart[i],cart[i+1]]; renderCart(); } };
      row.querySelector('[data-act=remove]').onclick = () => {
        const removedId = cart[i].event_id;
        cart.splice(i,1);
        renderCart();
        refreshMeetingRowFor(removedId);
      };
      list.appendChild(row);
    });
    publishBtn.disabled = false;
  }

  // find whichever meeting's currently-rendered race row matches this event
  // id and flip its "Added" badge back off, without collapsing anything.
  function refreshMeetingRowFor(eventId){
    document.querySelectorAll('#meetingsList [data-event-id]').forEach(node => {
      if(node.dataset.eventId === String(eventId)){
        node.classList.remove('selected');
        const badge = node.querySelector('[data-role=add-label]');
        if(badge) badge.textContent = 'Add \u2192';
      }
    });
  }

  function renderMeetingsList(){
    const list = $('#meetingsList');
    list.innerHTML = '';
    if(!lastMeetings.length){
      list.innerHTML = `<div class="empty-state">No meetings found for this date.</div>`;
      return;
    }
    lastMeetings.forEach(m => {
      const name = m.name || m.meeting_name || m.venue_name || 'Unnamed meeting';
      const races = m.races || m.events || [];
      const meetingId = m.id || m.meeting_id || name;
      const isOpen = expandedMeetings.has(meetingId);

      const wrap = el(`
        <div class="meeting-item" style="cursor:default;flex-direction:column;align-items:stretch">
          <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" data-role="head">
            <div><div class="m-name">${esc(name)}</div><div class="m-meta">${races.length} races &middot; ${esc(m.track_condition||'')}</div></div>
            <span class="mono" style="color:var(--teal)" data-role="toggle-label">${isOpen ? 'Collapse \u2191' : 'Expand \u2192'}</span>
          </div>
          <div data-role="races" style="display:${isOpen ? 'block' : 'none'};margin-top:10px"></div>
        </div>
      `);
      const head = wrap.querySelector('[data-role=head]');
      const toggleLabel = wrap.querySelector('[data-role=toggle-label]');
      const raceHost = wrap.querySelector('[data-role=races]');

      function drawRaceRows(){
        const details = raceCache.get(meetingId) || [];
        raceHost.innerHTML = '';
        details.forEach(r => {
          const added = inCart(r.event_id);
          const rowBtn = el(`
            <div class="meeting-item ${added?'selected':''}" data-event-id="${esc(r.event_id)}">
              <div><div class="m-name">R${r.race_number} &middot; ${esc(r.description||'')}</div><div class="m-meta">${esc(r.distance||'')}m &middot; ${esc(r.track_condition||'')}</div></div>
              <span class="mono" style="color:var(--teal)" data-role="add-label">${added ? 'Added \u2713' : 'Add \u2192'}</span>
            </div>
          `);
          rowBtn.onclick = (evt) => {
            evt.stopPropagation();
            if(inCart(r.event_id)){
              cart = cart.filter(x => x.event_id !== r.event_id);
            } else {
              cart.push(r);
            }
            renderCart();
            drawRaceRows(); // redraw just this meeting's races — stays expanded
          };
          raceHost.appendChild(rowBtn);
        });
      }

      async function loadAndRenderRaces(){
        if(!raceCache.has(meetingId)){
          raceHost.innerHTML = `<div class="empty-state">Loading races\u2026</div>`;
          try {
            const details = [];
            for(const r of races){
              const id = r.id || r.event_id;
              if(!id) continue;
              const ev = await getJSON('/api/event/' + encodeURIComponent(id));
              details.push({
                event_id: id,
                race_number: Number(ev.race?.race_number) || details.length + 1,
                meeting_name: name,
                venue_name: ev.race?.venue_name || name,
                category: lastCategory,
                description: ev.race?.description || '',
                distance: ev.race?.distance || '',
                track_condition: ev.race?.track_condition || ''
              });
            }
            details.sort((a,b)=>a.race_number-b.race_number);
            raceCache.set(meetingId, details);
          } catch(e){
            raceHost.innerHTML = `<div class="empty-state">${esc(e.message)}</div>`;
            return;
          }
        }
        drawRaceRows();
      }

      head.onclick = async () => {
        const nowOpen = !expandedMeetings.has(meetingId);
        if(nowOpen) expandedMeetings.add(meetingId); else expandedMeetings.delete(meetingId);
        raceHost.style.display = nowOpen ? 'block' : 'none';
        toggleLabel.textContent = nowOpen ? 'Collapse \u2191' : 'Expand \u2192';
        if(nowOpen) await loadAndRenderRaces();
      };

      if(isOpen) loadAndRenderRaces();
      list.appendChild(wrap);
    });
  }

  $('#loadMeetings').onclick = async () => {
    const date = $('#date').value;
    const category = $('#category').value;
    lastDate = date; lastCategory = category;
    const status = $('#meetingsStatus');
    status.textContent = 'Loading meetings\u2026'; status.className='status';
    try {
      const p = await getJSON('/api/meetings?date=' + encodeURIComponent(date) + '&country=NZ&category=' + category);
      const meetings = p?.meetings || p?.data?.meetings || (Array.isArray(p?.data)?p.data:[]) || [];
      lastMeetings = meetings;
      raceCache.clear();
      expandedMeetings.clear();
      renderMeetingsList();
      $('#meetingsCard').style.display = 'block';
      status.textContent = `${meetings.length} meeting(s) found.`; status.className='status good';
    } catch(e){
      status.textContent = e.message; status.className = 'status bad';
    }
  };

  $('#publishBtn').onclick = async () => {
    if(!cart.length) return;
    const status = $('#publishStatus');
    status.textContent = 'Publishing\u2026'; status.className='status';
    try {
      await getJSON('/api/show', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ date: lastDate || todayISO(), country: 'NZ', races: cart }) });
      status.textContent = 'Published. Presenters can now make their selections.'; status.className='status good';
    } catch(e){
      status.textContent = e.message; status.className='status bad';
    }
  };

  renderCart();
}

// ---------- presenter picks: Best Bet / Best of the Rest / Bank Builder ----------
async function mountPresenterPicks(host, presenterId, initialType = "best-bet"){
  const body = host;
  body.innerHTML = `<div class="empty-state">Loading presenter picks…</div>`;
  try{
    const [{ presenters }, { picks }] = await Promise.all([getJSON('/api/presenters'), getJSON('/api/presenter-picks?presenterId='+encodeURIComponent(presenterId))]);
    const presenter = presenters.find(p=>p.id===presenterId);
    if(!presenter){ body.innerHTML='<div class="empty-state">Unknown presenter.</div>'; return; }
    let type=initialType, date=todayISO(), meetings=[], selectedMeeting=null, selectedRace=null, selectedHorse=null;
    let savedByType=new Map();
    (picks||[]).forEach(p=>{
      if(p.type==='best-rest'){
        const list=savedByType.get('best-rest')||[]; list.push(p); savedByType.set('best-rest',list);
      } else savedByType.set(p.type,p);
    });
    const labelsForPick=t=>({'best-bet':'Best Bet','best-rest':'Best of the Rest','bank-builder':'Bank Builder'})[t];
    body.innerHTML=`<div class="card"><span class="eyebrow">${esc(presenter.name)}</span>
      <p class="lead">Choose your ${labelsForPick(type).toLowerCase()}. Best of the Rest can contain multiple options.</p>
      </div>
      <div class="card"><div class="field"><label>Date</label><input id="pickDate" type="date" value="${date}"></div>
      <div class="pick-step"><div class="pick-label">1 · Meeting</div><select id="pickMeeting"><option>Loading meetings…</option></select></div>
      <div class="pick-step"><div class="pick-label">2 · Race</div><select id="pickRace" disabled><option>Select a meeting first…</option></select></div>
      <div class="pick-step"><div class="pick-label">3 · Selection</div><div id="pickRunners"><div class="empty-state">Select a race first.</div></div></div>
      <div class="pick-summary" id="pickSummary">No runner selected.</div>
      <div class="export-row"><button class="btn" id="savePick">Save Best Bet</button><button class="btn ghost" id="clearPick">Clear</button></div>
      <div class="status" id="pickStatus"></div></div>
      <div class="card"><span class="eyebrow">Saved picks</span><div id="savedPicks"></div></div>`;
    const meetingSel=$('#pickMeeting'), raceSel=$('#pickRace'), runnersBox=$('#pickRunners');
    function savedList(k){ const v=savedByType.get(k); return k==='best-rest' ? (Array.isArray(v)?v:[]) : (v?[v]:[]); }
    function renderSaved(){
      const types=[['best-bet','Best Bet'],['best-rest','Best of the Rest'],['bank-builder','Bank Builder']];
      $('#savedPicks').innerHTML=types.map(([k,label])=>{
        const list=savedList(k);
        if(!list.length) return `<div class="saved-pick"><span class="kind">${label}</span><small>No selection saved.</small></div>`;
        return `<div class="saved-group"><span class="kind">${label}${k==='best-rest'?' · '+list.length+' option'+(list.length===1?'':'s'):''}</span>`+list.map(p=>`<div class="saved-pick"><div><strong>${esc(p.horseName)}</strong><small>${esc(p.meetingName)} · R${esc(p.raceNumber)} · ${esc(p.date)}</small></div>${k==='best-rest'?`<button class="btn ghost remove-rest" data-event="${esc(p.eventId)}" data-runner="${esc(p.runnerNumber)}">Remove</button>`:''}</div>`).join('')+`</div>`;
      }).join('');
      document.querySelectorAll('.remove-rest').forEach(btn=>btn.onclick=async()=>{
        btn.disabled=true;
        try{await getJSON('/api/presenter-pick?presenterId='+encodeURIComponent(presenterId)+'&type=best-rest&eventId='+encodeURIComponent(btn.dataset.event)+'&runnerNumber='+encodeURIComponent(btn.dataset.runner));
          const list=savedList('best-rest').filter(p=>!(String(p.eventId)===String(btn.dataset.event)&&String(p.runnerNumber)===String(btn.dataset.runner)));
          if(list.length)savedByType.set('best-rest',list); else savedByType.delete('best-rest'); renderSaved();
        }catch(e){$('#pickStatus').textContent=e.message;$('#pickStatus').className='status bad';}finally{btn.disabled=false;}
      });
    }
    function updateSummary(){
      $('#pickSummary').innerHTML=selectedHorse?`<strong>${esc(selectedHorse.runner_number)}. ${esc(selectedHorse.name)}</strong><small>${esc(selectedMeeting.name)} · Race ${esc(selectedRace.race_number)} · ${esc(selectedRace.description||'')} · ${esc(date)}</small>`:'<span style="color:var(--ink-dim)">No runner selected.</span>';
    }
    function resetRace(){selectedRace=null;selectedHorse=null;raceSel.disabled=true;raceSel.innerHTML='<option>Select a meeting first…</option>';runnersBox.innerHTML='<div class="empty-state">Select a race first.</div>';updateSummary();}
    function renderMeetings(){meetingSel.innerHTML='<option value="">Select a meeting…</option>'+meetings.map((m,i)=>`<option value="${i}">${esc((m.meeting_number<9999?m.meeting_number+' — ':'')+m.name)} (${esc(m.country)})</option>`).join('');}
    async function loadMeetings(){
      meetingSel.disabled=true; meetingSel.innerHTML='<option>Loading NZ & Australia Thoroughbred meetings…</option>'; resetRace();
      try{const data=await getJSON('/api/presenter-meetings?date='+encodeURIComponent(date)); meetings=data.meetings||[];renderMeetings();meetingSel.disabled=false;$('#pickStatus').textContent=`${meetings.length} relevant Thoroughbred meeting(s) found.`;$('#pickStatus').className='status good';}
      catch(e){meetingSel.innerHTML='<option>Could not load meetings</option>';$('#pickStatus').textContent=e.message;$('#pickStatus').className='status bad';}
    }
    meetingSel.onchange=()=>{
      selectedMeeting=meetings[Number(meetingSel.value)];selectedHorse=null;
      if(!selectedMeeting){resetRace();return;}
      raceSel.disabled=false;raceSel.innerHTML='<option value="">Select a race…</option>'+selectedMeeting.races.map(r=>`<option value="${esc(r.event_id)}">R${esc(r.race_number)} — ${esc(r.description||'Race '+r.race_number)}${r.distance?' · '+esc(r.distance)+'m':''}</option>`).join('');
      runnersBox.innerHTML='<div class="empty-state">Select a race first.</div>';updateSummary();
    };
    raceSel.onchange=async()=>{
      selectedHorse=null;selectedRace=selectedMeeting?.races.find(r=>String(r.event_id)===String(raceSel.value));
      if(!selectedRace){runnersBox.innerHTML='<div class="empty-state">Select a race first.</div>';updateSummary();return;}
      runnersBox.innerHTML='<div class="empty-state">Loading runners…</div>';
      try{
        const ev=await getJSON('/api/event/'+encodeURIComponent(selectedRace.event_id)), runners=(ev.runners||[]).filter(r=>!r.is_scratched);
        runnersBox.innerHTML=''; runners.forEach(r=>{
          const node=el(`<div class="pick-runner"><div class="num">${esc(r.runner_number)}</div><div><strong>${esc(r.name)}</strong><div class="meta">Barrier ${esc(r.barrier ?? '—')} · T: ${esc(r.trainer_name||r.trainer||'')}${r.jockey?' · J: '+esc(r.jockey):''}</div></div><div class="check">✓</div></div>`);
          node.onclick=()=>{document.querySelectorAll('.pick-runner').forEach(n=>n.classList.remove('selected'));node.classList.add('selected');selectedHorse=r;updateSummary();};runnersBox.appendChild(node);
        });
      }catch(e){runnersBox.innerHTML=`<div class="status bad">${esc(e.message)}</div>`;}
    };
    $('#pickDate').onchange=()=>{date=$('#pickDate').value||todayISO();loadMeetings();};
    $('#clearPick').onclick=()=>{meetingSel.value='';selectedMeeting=null;resetRace();};
    $('#savePick').onclick=async()=>{
      if(!selectedMeeting||!selectedRace||!selectedHorse){$('#pickStatus').textContent='Please choose a meeting, race and horse first.';$('#pickStatus').className='status bad';return;}
      const b=$('#savePick');b.disabled=true;$('#pickStatus').textContent='Saving…';$('#pickStatus').className='status';
      try{
        const saved=await getJSON('/api/presenter-pick',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
          presenterId,type,date,meetingId:selectedMeeting.meeting_id||selectedMeeting.id,meetingNumber:selectedMeeting.meeting_number,meetingName:selectedMeeting.name,country:selectedMeeting.country,
          eventId:selectedRace.event_id,raceNumber:selectedRace.race_number,raceName:selectedRace.description,distance:selectedRace.distance,
          runnerNumber:selectedHorse.runner_number,horseName:selectedHorse.name,trainerName:selectedHorse.trainer_name||selectedHorse.trainer||'',jockeyName:selectedHorse.jockey||'',barrier:selectedHorse.barrier,silkImageUrl:selectedHorse.silk_url_128x128||selectedHorse.silk_url_64x64||''
        })});
        if(type==='best-rest'){
          const list=savedList('best-rest').filter(p=>!(String(p.eventId)===String(saved.pick.eventId)&&String(p.runnerNumber)===String(saved.pick.runnerNumber))); list.push(saved.pick); savedByType.set('best-rest',list);
        } else savedByType.set(type,saved.pick);
        renderSaved();
        $('#pickStatus').textContent=type==='best-rest'?'Best of the Rest option saved. Add another option if required.':labelsForPick(type)+' saved.';$('#pickStatus').className='status good';
        // Confidence/fast workflow: clear the picker after saving a Best of the Rest option so another can be added immediately.
        if(type==='best-rest'){meetingSel.value='';selectedMeeting=null;resetRace();}
      }catch(e){$('#pickStatus').textContent=e.message;$('#pickStatus').className='status bad';}finally{b.disabled=false;}
    };
    $('#savePick').textContent='Save '+labelsForPick(type);
    if(type==='best-rest') $('#savePick').textContent='Add Best of the Rest';
    const existing=savedList(type)[0];
    if(existing){ date=existing.date; $('#pickDate').value=date; }
    renderSaved();loadMeetings();
  }catch(e){body.innerHTML=`<div class="empty-state">${esc(e.message)}</div>`;}
}
// ---------- presenter selection flow ----------
function renderSelect(presenterId){
  const body = el(`<div id="selectBody"><div class="empty-state">Loading\u2026</div></div>`);
  shell('Make Your Selections', 'Race Preview · Best Bet · Best of the Rest · Bank Builder', body, '#/');
  (async () => {
    try {
      const [{ presenters }, { show }] = await Promise.all([getJSON('/api/presenters'), getJSON('/api/show')]);
      const presenter = presenters.find(p=>p.id===presenterId);
      if(!presenter){ body.innerHTML = `<div class="empty-state">Unknown presenter.</div>`; return; }
      if(!show){ body.innerHTML = `<div class="empty-state">No preview list has been set up yet. Ask the producer to publish one first.</div>`; return; }
      const { selections } = await getJSON('/api/selections');
      const mySelections = new Map(selections.filter(s=>s.presenterId===presenterId).map(s=>[s.eventId, s]));
      const races = show.races;
      let current = 0;
      const runnerCache = new Map();
      const pendingSaves = new Set();

      const wrap = el(`
        <div>
          <div class="card">
            <span class="eyebrow">${esc(presenter.name)}</span>
            <p class="lead">${esc(show.date)} &middot; ${races.length} race(s) across ${new Set(races.map(r=>r.meeting_name)).size} meeting(s)</p>
            <div class="pick-tabs" style="margin-top:14px">
              <button class="pick-tab active" data-workspace="preview">Race Preview</button>
              <button class="pick-tab" data-workspace="picks">Best Bet</button>
              <button class="pick-tab" data-workspace="picks">Best of the Rest</button>
              <button class="pick-tab" data-workspace="picks">Bank Builder</button>
            </div>
          </div>
          <div id="previewPanel">
            <div class="race-tabs" id="raceTabs"></div>
            <div class="card" id="raceCard"></div>
            <div class="card">
              <button class="btn" id="saveSelectionsBtn">Save Selections</button>
              <div class="status" id="saveStatus">Tap a runner to pick it, then hit Save before you leave.</div>
            </div>
          </div>
          <div id="pickPanel" style="display:none"></div>
        </div>
      `);
      body.innerHTML = ''; body.appendChild(wrap);
      const workspaceTabs = [...wrap.querySelectorAll('[data-workspace]')];
      workspaceTabs.forEach((tab, index) => {
        tab.onclick = async () => {
          workspaceTabs.forEach(t=>t.classList.remove('active'));
          tab.classList.add('active');
          const isPreview = index === 0;
          $('#previewPanel').style.display = isPreview ? 'block' : 'none';
          $('#pickPanel').style.display = isPreview ? 'none' : 'block';
          if(!isPreview){
            const typeMap=['best-bet','best-rest','bank-builder'];
            const type = typeMap[index-1];
            await mountPresenterPicks($('#pickPanel'), presenterId, type);
          }
        };
      });

      // Warn if leaving mid-save via the back link.
      const backLink = document.querySelector('header.topbar .nav-link');
      if(backLink){
        backLink.addEventListener('click', (e) => {
          if(pendingSaves.size){
            if(!confirm(`${pendingSaves.size} selection(s) are still saving \u2014 leave anyway?`)) e.preventDefault();
          }
        });
      }
      function refreshBackLinkState(){
        if(!backLink) return;
        backLink.classList.toggle('pending', pendingSaves.size > 0);
      }

      function tabLabel(r){
        const code = (r.venue_name || r.meeting_name || '').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase() || 'RCE';
        return `${code} R${r.race_number}`;
      }

      function renderTabs(){
        const tabs = $('#raceTabs');
        tabs.innerHTML = '';
        races.forEach((r, i) => {
          const t = el(`<button class="race-tab ${i===current?'active':''} ${mySelections.has(r.event_id)?'done':''}" title="${esc(r.meeting_name)}">${esc(tabLabel(r))}</button>`);
          t.onclick = () => { current = i; renderTabs(); renderRace(); };
          tabs.appendChild(t);
        });
      }

      async function persistSelection(race, r, jockeyLabel){
        const token = Symbol();
        pendingSaves.add(token);
        refreshBackLinkState();
        try {
          const saved = await getJSON('/api/selection', {
            method:'POST', headers:{'content-type':'application/json'},
            body: JSON.stringify({
              presenterId, eventId: race.event_id, raceNumber: race.race_number,
              meetingName: race.meeting_name, description: race.description,
              runnerNumber: r.runner_number, horseName: r.name,
              trainerName: r.trainer_name || r.trainer || '',
              jockeyName: jockeyLabel,
              silkImageUrl: r.silk_url_128x128 || r.silk_url_64x64 || ''
            })
          });
          mySelections.set(race.event_id, saved.selection);
          renderTabs();
        } catch(e){
          alert(e.message);
        } finally {
          pendingSaves.delete(token);
          refreshBackLinkState();
        }
      }

      async function renderRace(){
        const raceCard = $('#raceCard');
        raceCard.innerHTML = `<div class="empty-state">Loading runners\u2026</div>`;
        const race = races[current];
        let ev = runnerCache.get(race.event_id);
        if(!ev){
          ev = await getJSON('/api/event/' + encodeURIComponent(race.event_id));
          runnerCache.set(race.event_id, ev);
        }
        const existing = mySelections.get(race.event_id);
        const runners = (ev.runners||[]).filter(r=>!r.is_scratched);
        raceCard.innerHTML = '';
        raceCard.appendChild(el(`
          <div class="race-head">
            <div class="r-title">${esc(race.meeting_name)} &middot; Race ${race.race_number} &mdash; ${esc(ev.race?.description||race.description||'')}</div>
            <div class="r-meta">${esc(ev.race?.distance||race.distance||'')}m &middot; ${esc(ev.race?.track_condition||race.track_condition||'')} &middot; ${runners.length} runners</div>
          </div>
        `));
        runners.forEach(r => {
          const isSel = existing && String(existing.runnerNumber) === String(r.runner_number);
          const jockeyLabel = race.category === 'H' ? (r.driver_name || r.driver || '') : (r.jockey || '');
          const jockeyPrefix = race.category === 'H' ? 'D' : 'J';
          const extraBits = [
            r.barrier ? `Barrier ${esc(r.barrier)}` : '',
            r.weight ? `${esc(r.weight)}kg` : ''
          ].filter(Boolean).join(' &middot; ');
          const silk = r.silk_url_64x64
            ? `<img src="${esc(r.silk_url_64x64)}" alt="" style="width:38px;height:38px;border-radius:6px;object-fit:cover;flex:none;border:2px solid var(--navy-deep)">`
            : `<div class="saddlecloth">${esc(r.runner_number)}</div>`;
          const node = el(`
            <div class="runner ${isSel?'selected':''}" data-runner="${esc(r.runner_number)}">
              ${silk}
              <div>
                <div class="r-name">${esc(r.runner_number)}. ${esc(r.name)}</div>
                <div class="r-trainer">T: ${esc(r.trainer_name||r.trainer||'')}${jockeyLabel ? ` &middot; ${jockeyPrefix}: ${esc(jockeyLabel)}` : ''}</div>
                ${extraBits ? `<div class="r-trainer">${extraBits}</div>` : ''}
              </div>
              <div class="r-check">&#10003;</div>
            </div>
          `);
          node.onclick = () => {
            document.querySelectorAll('.runner').forEach(n=>n.classList.remove('selected'));
            node.classList.add('selected');
            persistSelection(race, r, jockeyLabel);
          };
          raceCard.appendChild(node);
        });
      }

      $('#saveSelectionsBtn').onclick = async () => {
        const btn = $('#saveSelectionsBtn');
        const status = $('#saveStatus');
        btn.disabled = true;
        status.textContent = pendingSaves.size ? 'Waiting for in-progress saves\u2026' : 'Confirming\u2026';
        status.className = 'status';
        try {
          while(pendingSaves.size){
            await new Promise(res => setTimeout(res, 150));
          }
          const { selections: fresh } = await getJSON('/api/selections');
          const mine = fresh.filter(s=>s.presenterId===presenterId);
          mine.forEach(s => mySelections.set(s.eventId, s));
          renderTabs();
          const missing = races.length - mine.length;
          if(missing > 0){
            status.textContent = `Saved. ${mine.length} of ${races.length} races picked \u2014 ${missing} still need a selection.`;
            status.className = 'status bad';
          } else {
            status.textContent = `All ${mine.length} selections confirmed saved to the dashboard. Safe to go back now.`;
            status.className = 'status good';
          }
        } catch(e){
          status.textContent = e.message; status.className = 'status bad';
        } finally {
          btn.disabled = false;
        }
      };

      renderTabs();
      renderRace();
    } catch(e){
      body.innerHTML = `<div class="empty-state">${esc(e.message)}</div>`;
    }
  })();
}

function renderPresenterPicks(presenterId){
  const body = el(`<div id="pickBody"></div>`);
  shell('Presenter Picks', 'Best Bet · Best of the Rest · Bank Builder', body, '#/');
  mountPresenterPicks(body, presenterId);
}

// ---------- speed map editor ----------
async function mountSpeedMapEditor(host, options = {}){
  const compact = !!options.compact;
  host.innerHTML = `<div class="card"><span class="eyebrow">Speed Map Editor</span><p class="lead">Loading Speed Maps…</p></div>`;
  try {
    const { show, maps } = await getJSON('/api/speedmaps');
    if(!show){
      host.innerHTML = `<div class="card"><span class="eyebrow">Speed Map Editor</span><div class="empty-state">No preview list set yet. Set races from the Producer Dashboard first.</div></div>`;
      return;
    }
    const eventData = new Map();
    const mapData = new Map((maps || []).map(x => [String(x.eventId), x.map]));
    host.innerHTML = `
      <div class="card">
        <span class="eyebrow">Speed Map Editor</span>
        <p class="lead">Runners are shown in barrier order. Set the runner's speed from 0–100%. The generated Trio graphic always uses a 100% maximum bar and this value as the runner's position.</p>
        <div class="speedmap-toolbar">
          <button class="btn" data-action="save">Save all Speed Maps</button>
          <button class="btn ghost" data-action="reset">Reset all to 50%</button>
          <button class="btn ghost" data-action="download">Download Speed Maps XML</button>
          ${compact ? `<a class="btn ghost" href="#/speedmaps" style="text-decoration:none;display:inline-flex;align-items:center">Open full editor</a>` : ''}
          <span class="status" data-role="status"></span>
        </div>
      </div>
      <div data-role="races"></div>`;
    const container = host.querySelector('[data-role=races]');
    for(const race of show.races || []){
      let ev = eventData.get(String(race.event_id));
      if(!ev){ ev = await getJSON('/api/event/' + encodeURIComponent(race.event_id)); eventData.set(String(race.event_id), ev); }
      const runners = (ev.runners || []).filter(r => !r.is_scratched).sort((a,b) => Number(a.barrier ?? 9999) - Number(b.barrier ?? 9999));
      const saved = mapData.get(String(race.event_id));
      const savedByRunner = new Map((saved?.runners || []).map(r => [String(r.runnerNumber), Number(r.speedMap)]));
      const raceNode = el(`<div class="card speedmap-race" data-event="${esc(race.event_id)}">
        <div class="speedmap-race-head"><div><div class="speedmap-race-title">${esc(race.venue_name || race.meeting_name)} · Race ${esc(race.race_number)}</div><div class="speedmap-race-meta">${esc(ev.race?.description || race.description || '')}${race.distance || ev.race?.distance ? ` · ${esc(race.distance || ev.race?.distance)}m` : ''} · ${runners.length} runners · barrier order</div></div><div class="speedmap-race-meta">${runners.length <= 8 ? '8-runner template' : runners.length <= 12 ? '12-runner template' : runners.length <= 16 ? '16-runner template' : '24-runner template'}</div></div>
      </div>`);
      runners.forEach(r => {
        const value = savedByRunner.has(String(r.runner_number)) ? savedByRunner.get(String(r.runner_number)) : 50;
        const row = el(`<div class="speedmap-runner" data-runner="${esc(r.runner_number)}" data-barrier="${esc(r.barrier ?? '')}">
          <div class="speedmap-barrier">B${esc(r.barrier ?? '—')}</div>
          <div class="speedmap-name">${esc(r.runner_number)}. ${esc(r.name)}<small>Set speed position</small></div>
          <input class="speedmap-range" type="range" min="0" max="100" step="1" value="${value}">
          <div class="speedmap-value">${value}%</div>
        </div>`);
        const range = row.querySelector('.speedmap-range'), valueEl = row.querySelector('.speedmap-value');
        range.oninput = () => { valueEl.textContent = `${range.value}%`; };
        raceNode.appendChild(row);
      });
      container.appendChild(raceNode);
    }
    function collectRace(raceNode){
      return [...raceNode.querySelectorAll('.speedmap-runner')].map(row => ({ barrier: row.dataset.barrier ? Number(row.dataset.barrier) : null, runnerNumber: row.dataset.runner, horseName: row.querySelector('.speedmap-name').childNodes[0].textContent.replace(/^\s*\d+\.\s*/, '').trim(), speedMap: Number(row.querySelector('.speedmap-range').value) }));
    }
    async function saveAll(){
      const status=host.querySelector('[data-role=status]'); status.textContent='Saving…'; status.className='status';
      try{
        for(const node of container.querySelectorAll('.speedmap-race')){
          await getJSON('/api/speedmap',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({eventId:node.dataset.event,runners:collectRace(node)})});
        }
        status.textContent='All Speed Maps saved.'; status.className='status good';
      }catch(e){ status.textContent=e.message; status.className='status bad'; }
    }
    host.querySelector('[data-action=save]').onclick=saveAll;
    host.querySelector('[data-action=reset]').onclick=()=>container.querySelectorAll('.speedmap-range').forEach(input=>{input.value=50;input.dispatchEvent(new Event('input'));});
    host.querySelector('[data-action=download]').onclick=async()=>{ await saveAll(); window.location.href='/api/export/speedmaps'; };
  } catch(e){ host.innerHTML=`<div class="card"><div class="empty-state">${esc(e.message)}</div></div>`; }
}

function renderSpeedMaps(){
  const body = el(`<div id="speedMapBody"></div>`);
  shell('Speed Maps', 'Presenter / producer speed map editor · runners ordered by barrier', body, '#/');
  mountSpeedMapEditor(body);
}

// ---------- producer dashboard ----------
function renderDashboard(){
  const body = el(`<div id="dashBody"><div class="empty-state">Loading\u2026</div></div>`);
  shell('Producer Dashboard', 'Review selections and export', body, '#/');
  (async () => {
    try {
      const { show } = await getJSON('/api/show');
      if(!show){
        $('#dashBody').innerHTML = `<div class="card"><div class="empty-state">No preview list set yet. <a class="nav-link" href="#/setup">Set one up</a>.</div></div>`;
        return;
      }
      const [{ presenters }, { selections }] = await Promise.all([getJSON('/api/presenters'), getJSON('/api/selections')]);
      const byEventAndPresenter = new Map();
      selections.forEach(s => byEventAndPresenter.set(s.eventId + ':' + s.presenterId, s));
      const rows = show.races.map(r => {
        const cells = presenters.map(p => {
          const sel = byEventAndPresenter.get(r.event_id + ':' + p.id);
          if(!sel) return `<td class="empty">&mdash;</td>`;
          return `<td>
            <div class="cell-horse">${esc(sel.runnerNumber)}, ${esc(sel.horseName)}</div>
            <div class="cell-trainer">T: ${esc(sel.trainerName)}${sel.jockeyName ? ` &middot; ${esc(sel.jockeyName)}` : ''}</div>
            <input class="silk-edit" data-event="${esc(r.event_id)}" data-presenter="${p.id}" value="${esc(sel.silkSlug)}" title="Silk key (edit if wrong)">
          </td>`;
        }).join('');
        return `<tr><th>${esc(r.meeting_name)}<br>R${r.race_number}<br><span style="font-weight:400;font-size:11px;color:var(--ink-dim)">${esc(r.description||'')}</span></th>${cells}</tr>`;
      }).join('');
      const filled = selections.length, total = show.races.length * presenters.length;
      $('#dashBody').innerHTML = `
        <div class="card">
          <span class="eyebrow">${esc(show.date)}</span>
          <p class="lead">${filled} of ${total} selections submitted across ${show.races.length} race(s) and ${new Set(show.races.map(r=>r.meeting_name)).size} meeting(s).</p>
          <div class="export-row">
            <button class="btn" id="exportXml">Download Viz Trio XML</button>
            <button class="btn ghost" id="speedMapsBtn">Speed Maps</button>
            <button class="btn ghost" id="exportSpeedMaps">Download Speed Maps XML</button>
            <a class="btn ghost" href="#/setup" style="text-decoration:none;display:inline-flex;align-items:center">Set Races for Week</a>
            <button class="btn ghost" id="exportDoc">Download Word backup</button>
            <button class="btn ghost" id="exportSilks">Download Silks (.zip)</button>
            
          </div>
          <div class="status" id="exportStatus"></div>
        </div>
        <div class="card">
          <span class="eyebrow">Selections grid</span>
          <div class="table-wrap">
            <table class="board">
              <thead><tr><th>Race</th>${presenters.map(p=>`<th>${esc(p.first)}</th>`).join('')}</tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
      document.querySelectorAll('.silk-edit').forEach(input => {
        input.onchange = async () => {
          try {
            await getJSON('/api/selection/silk', {
              method:'POST', headers:{'content-type':'application/json'},
              body: JSON.stringify({ eventId: input.dataset.event, presenterId: input.dataset.presenter, silkSlug: input.value })
            });
          } catch(e){ alert(e.message); }
        };
      });
      $('#exportXml').onclick = () => { window.location.href = '/api/export/xml'; };
      $('#speedMapsBtn').onclick = () => { location.hash = '#/speedmaps'; };
      $('#exportSpeedMaps').onclick = () => { window.location.href = '/api/export/speedmaps'; };
      $('#exportDoc').onclick = () => { window.location.href = '/api/export/doc'; };
      $('#exportSilks').onclick = () => { window.location.href = '/api/export/silks'; };
    } catch(e){
      $('#dashBody').innerHTML = `<div class="empty-state">${esc(e.message)}</div>`;
    }
  })();
}
</script>
